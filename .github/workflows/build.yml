name: Build Icy Cheak Debug APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Required for the release step below: creating/updating a GitHub Release and
# attaching the built APK needs `contents: write`. Everything else stays read-only.
permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Resolve version name
        id: version
        run: |
          # Same derivation as app/build.gradle.kts: it reads GITHUB_RUN_NUMBER
          # too, so the release tag can never drift from BuildConfig.VERSION_NAME
          # (which is what the in-app updater compares against).
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "resolved versionName=$VERSION_NAME (versionCode $((GITHUB_RUN_NUMBER + 1)))"

      # Deliberately NOT piped into `tee`: `gradle ... | tee log` reports tee's exit
      # status (0) when the shell has no `pipefail`, which silently turns a failed
      # build into a green step. Redirecting to the file keeps Gradle's real status,
      # and the tail is printed so the failing lines are always in the step output.
      - name: Assemble Debug APK
        id: assemble
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          status=$?
          tail -n 120 build.log
          exit $status

      # Failures are surfaced as check-run annotations, because the raw Gradle log is
      # not downloadable from every environment (the log host is unreachable from
      # some sandboxes). One annotation carries everything, so it is readable through
      # GET /repos/{owner}/{repo}/check-runs/{id}/annotations.
      - name: Publish compiler errors
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=Gradle::build.log is missing — Gradle never started."
            exit 0
          fi
          if grep -qE "^e: " build.log; then
            COUNT=$(grep -cE "^e: " build.log)
            MSG=$(grep -E "^e: " build.log | head -40 | tr '\n' '|')
            echo "::error title=Kotlin errors ($COUNT)::${MSG:0:6000}"
          else
            MSG=$(tail -n 40 build.log | tr '\n' '|')
            echo "::error title=Gradle output tail::${MSG:0:6000}"
          fi

      # Independent verification that the build actually produced an installable APK.
      # Without this, an empty `app/build/outputs` still yielded a green run.
      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs -type f -name '*.apk' -print -quit || true)
          if [ -z "$APK" ]; then
            echo "::error title=APK::No APK was produced, so the build never reached packaging."
            find app/build -maxdepth 3 -type d 2>/dev/null | head -20 || true
            exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          echo "::notice title=APK built::$APK ($SIZE bytes)"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IcyCheak-Debug-APK
          # Recursive on purpose: the exact variant subdirectory is not assumed, and
          # `error` means an empty match fails the run instead of warning quietly.
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version_name }}"
          OUT_DIR=$(dirname "${{ steps.apk.outputs.path }}")
          DEST="$OUT_DIR/IcyCheak-$VERSION.apk"
          cp "${{ steps.apk.outputs.path }}" "$DEST"
          echo "release_asset=$DEST" >> "$GITHUB_ENV"
          echo "release_asset_name=IcyCheak-$VERSION.apk" >> "$GITHUB_ENV"
          echo "::notice title=Release asset::$(basename "$DEST") in $OUT_DIR"

      # Publishes (or updates) the release the in-app updater reads from
      # https://api.github.com/repos/NotBlack777/Icy-Cheak/releases/latest.
      # Releases are used instead of artifacts: artifact downloads require
      # authentication and expire, so they cannot back a public updater.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Icy Cheak v${{ steps.version.outputs.version_name }}
          body: |
            Automated build of `Icy Cheak` from `main` (${{ github.sha }}).

            **Install:** download `${{ env.release_asset_name }}` below and open it on your
            device. Android will ask you to allow installing unknown apps — that is the normal
            platform confirmation for any app installed outside a store.

            **In-app updates:** open Settings › Updates › *Check for updates*, or wait for the
            automatic check on launch.
          files: ${{ env.release_asset }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

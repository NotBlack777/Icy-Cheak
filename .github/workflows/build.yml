name: Build DevCheck+ Debug APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevCheckPlus-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # The Release job below only runs on main, so the signed release path
      # (signing config + committed keystore) is exercised here on every branch
      # and PR instead of being discovered broken after a merge.
      - name: Verify Signed Release Build
        run: ./gradlew assembleRelease --stacktrace

  release:
    name: Publish GitHub Release
    # Actions artifacts expire and need auth to download, so the in-app updater
    # reads Releases instead: this job is what makes an update discoverable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history so generate_release_notes can diff against the last tag.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Resolve Release Tag
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_ENV"
          echo "version_name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Assemble Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PdevcheckVersionName="${version_name}" \
            -PdevcheckVersionCode="${version_code}"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DevCheckPlus-${tag}.apk"
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: DevCheck+ ${{ env.tag }}
          body: |
            Automated build from `${{ github.sha }}`.

            Install the APK below, or let an existing install pick it up:
            DevCheck+ checks this feed on launch (Settings → About → Check for
            updates automatically) and offers to install the newest tag.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/DevCheckPlus-${{ env.tag }}.apk
